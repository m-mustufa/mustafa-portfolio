<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/img/logo-2.png" sizes="48x48" />

    <!-- SEO Meta -->
    <title>{{TITLE}} | Muhammad Mustafa</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="author" content="Muhammad Mustafa">
    <link rel="canonical" href="https://mustcode.netlify.app/blog/{{SLUG}}.html">

    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:image" content="https://mustcode.netlify.app/blog/images/{{SLUG}}.jpg">
    <meta property="og:url" content="https://mustcode.netlify.app/blog/{{SLUG}}.html">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Muhammad Mustafa">
    <meta property="og:locale" content="en_US">
    <meta property="article:published_time" content="{{PUBLISH_DATE_ISO}}">
    <meta property="article:author" content="Muhammad Mustafa">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="https://mustcode.netlify.app/blog/images/{{SLUG}}.jpg">

    <meta name="theme-color" content="#00C19D" />
    <link rel="apple-touch-icon" href="../assets/img/logo-2.png">
    <link rel="manifest" href="../assets/site.webmanifest">

    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/style.js" defer></script>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://mustcode.netlify.app/" },
            { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://mustcode.netlify.app/blog/index.html" },
            { "@type": "ListItem", "position": 3, "name": "{{TITLE}}", "item": "https://mustcode.netlify.app/blog/{{SLUG}}.html" }
          ]
        },
        {
          "@type": "BlogPosting",
          "headline": "{{TITLE}}",
          "description": "{{META_DESCRIPTION}}",
          "image": "https://mustcode.netlify.app/blog/images/{{SLUG}}.jpg",
          "datePublished": "{{PUBLISH_DATE_ISO}}",
          "author": { "@id": "https://mustcode.netlify.app/#person" },
          "publisher": { "@id": "https://mustcode.netlify.app/#person" },
          "mainEntityOfPage": "https://mustcode.netlify.app/blog/{{SLUG}}.html"
        }
      ]
    }
    </script>
</head>

<body class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 min-h-screen text-white">
    <header class="fixed top-0 left-0 right-0 z-50 bg-opacity-90 fixed-height-header bg-gray-900">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 relative group">
                <img loading="lazy" src="../assets/img/logo-2.png" alt="Muhammad Mustafa logo" width="40" height="49"
                    class="logo-img-class animate-talk" />
            </a>

            <!-- Hamburger Button -->
            <button id="menuToggle" aria-label="Toggle navigation menu" aria-controls="mainNav" aria-expanded="false"
                class="md:hidden text-white focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <nav id="mainNav"
                class="hidden absolute top-full left-0 right-0 w-full bg-gray-900 px-4 py-4 flex flex-col space-y-4
                md:flex md:static md:flex-row md:items-center md:space-y-0 md:space-x-8 md:w-auto md:bg-transparent md:px-0 md:py-0 text-lg font-semibold z-40 transition">
                <a href="/#services" class="text-gray-300 hover:text-primary transition">Services</a>
                <a href="/portfolio.html" class="text-gray-300 hover:text-primary transition">Portfolio</a>
                <a href="/blog/index.html" class="text-primary">Blog</a>
                <a href="/#contact"
                    class="px-4 py-2 bg-white text-primary rounded hover:bg-[#0d5968] hover:text-white transition text-center">Contact</a>
            </nav>
        </div>
    </header>

    <main class="pt-40 pb-20 px-6">
        <article class="max-w-3xl mx-auto">
            <p class="text-primary text-sm font-semibold mb-3">{{PUBLISH_DATE}} · {{READING_TIME}} min read</p>
            <h1 class="text-3xl md:text-5xl font-bold mb-6 leading-tight">{{TITLE}}</h1>

            <img src="images/{{SLUG}}.jpg" alt="{{HERO_IMAGE_ALT}}" width="1200" height="675" loading="eager"
                class="w-full aspect-video object-cover rounded-2xl border border-gray-700 mb-10" />

            <div class="prose prose-invert prose-lg max-w-none
                prose-headings:text-white prose-headings:font-bold
                prose-p:text-gray-300 prose-a:text-primary prose-strong:text-white
                prose-li:text-gray-300 prose-code:text-primary">
                {{CONTENT_HTML}}
            </div>

            <div class="mt-16 pt-8 border-t border-gray-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                <p class="text-gray-400 text-sm">Written by Muhammad Mustafa — Full-Stack SaaS Engineer</p>
                <a href="/#contact"
                    class="px-5 py-2 bg-primary text-white rounded hover:bg-[#0d5968] transition text-sm font-semibold">Get
                    in touch</a>
            </div>
        </article>
    </main>

    <footer class="text-center py-6 text-sm text-gray-400 bg-gray-900">
        &copy; 2026 Muhammad Mustafa.
    </footer>
</body>

</html>
