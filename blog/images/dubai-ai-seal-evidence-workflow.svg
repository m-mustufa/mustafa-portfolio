<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Dubai AI Seal evidence workflow for AI SaaS companies</title>
  <desc id="description">A five-step workflow connecting an AI product claim to architecture, control evidence, evaluation results and human review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#0b2230"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11b7b2"/><stop offset="1" stop-color="#56d6dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00101a" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#background)"/>
  <circle cx="1085" cy="90" r="210" fill="#15b8b0" opacity="0.06"/><circle cx="115" cy="620" r="250" fill="#42cad3" opacity="0.04"/>
  <text x="70" y="82" fill="#52d4d9" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">DUBAI AI SEAL READINESS</text>
  <text x="70" y="133" fill="#f2f7f9" font-family="Arial, sans-serif" font-size="38" font-weight="800">Build one evidence chain a reviewer can follow</text>
  <text x="70" y="171" fill="#9fb6c5" font-family="Arial, sans-serif" font-size="21">Connect every AI claim to the system, controls, test results and accountable owner behind it.</text>
  <path d="M160 345 H1040" stroke="#2e6d79" stroke-width="4" stroke-dasharray="8 12" opacity="0.75"/>
  <g filter="url(#shadow)">
    <g transform="translate(45 230)"><rect width="205" height="230" rx="24" fill="#0d2635" stroke="#1d6873"/><circle cx="102" cy="58" r="30" fill="#123d4b" stroke="#42cbd1" stroke-width="2"/><text x="102" y="67" text-anchor="middle" fill="#67e0df" font-family="Arial, sans-serif" font-size="26" font-weight="800">01</text><text x="102" y="118" text-anchor="middle" fill="#f0f6f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Product claim</text><text x="102" y="151" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">User, problem and</text><text x="102" y="176" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">real AI capability</text></g>
    <g transform="translate(270 230)"><rect width="205" height="230" rx="24" fill="#0d2635" stroke="#1d6873"/><circle cx="102" cy="58" r="30" fill="#123d4b" stroke="#42cbd1" stroke-width="2"/><text x="102" y="67" text-anchor="middle" fill="#67e0df" font-family="Arial, sans-serif" font-size="26" font-weight="800">02</text><text x="102" y="118" text-anchor="middle" fill="#f0f6f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Architecture</text><text x="102" y="151" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">Data, model and</text><text x="102" y="176" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">human decision flow</text></g>
    <g transform="translate(495 230)"><rect width="205" height="230" rx="24" fill="#0d2635" stroke="#1d6873"/><circle cx="102" cy="58" r="30" fill="#123d4b" stroke="#42cbd1" stroke-width="2"/><text x="102" y="67" text-anchor="middle" fill="#67e0df" font-family="Arial, sans-serif" font-size="26" font-weight="800">03</text><text x="102" y="118" text-anchor="middle" fill="#f0f6f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Control evidence</text><text x="102" y="151" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">Privacy, security and</text><text x="102" y="176" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">tenant-isolation proof</text></g>
    <g transform="translate(720 230)"><rect width="205" height="230" rx="24" fill="#0d2635" stroke="#1d6873"/><circle cx="102" cy="58" r="30" fill="#123d4b" stroke="#42cbd1" stroke-width="2"/><text x="102" y="67" text-anchor="middle" fill="#67e0df" font-family="Arial, sans-serif" font-size="26" font-weight="800">04</text><text x="102" y="118" text-anchor="middle" fill="#f0f6f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Evaluation</text><text x="102" y="151" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">Quality, refusals and</text><text x="102" y="176" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">Arabic test results</text></g>
    <g transform="translate(945 230)"><rect width="205" height="230" rx="24" fill="#0d2635" stroke="#1d6873"/><circle cx="102" cy="58" r="30" fill="#123d4b" stroke="#42cbd1" stroke-width="2"/><text x="102" y="67" text-anchor="middle" fill="#67e0df" font-family="Arial, sans-serif" font-size="26" font-weight="800">05</text><text x="102" y="118" text-anchor="middle" fill="#f0f6f8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Human review</text><text x="102" y="151" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">Escalation, ownership</text><text x="102" y="176" text-anchor="middle" fill="#9db4c1" font-family="Arial, sans-serif" font-size="16">and release approval</text></g>
  </g>
  <rect x="70" y="520" width="1060" height="88" rx="20" fill="#0a1d29" stroke="#1a5360"/><rect x="70" y="520" width="8" height="88" rx="4" fill="url(#accent)"/>
  <text x="110" y="558" fill="#f2f7f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">The test:</text><text x="210" y="558" fill="#b5c9d3" font-family="Arial, sans-serif" font-size="20">Can an independent reviewer verify the claim without relying on marketing language?</text>
  <text x="110" y="588" fill="#7f9cab" font-family="Arial, sans-serif" font-size="16">This is an engineering readiness model, not an official Dubai AI Seal scoring formula.</text>
</svg>
