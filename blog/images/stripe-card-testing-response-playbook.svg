<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Stripe card-testing response playbook for AI SaaS</title>
  <desc id="description">A four-stage flow from detecting unusual payment activity to containing the attack, verifying Stripe signals and protecting SaaS entitlements.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset="0.55" stop-color="#0b2230"/>
      <stop offset="1" stop-color="#0f3940"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d4d8"/>
      <stop offset="1" stop-color="#00c19d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <circle cx="1060" cy="92" r="210" fill="none" stroke="#2ad4cf" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1060" cy="92" r="145" fill="none" stroke="#2ad4cf" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M0 570 C220 500 370 650 600 565 S980 500 1200 590" fill="none" stroke="#39d8d6" stroke-opacity="0.08" stroke-width="3"/>

  <text x="70" y="78" fill="#66e2df" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">STRIPE FRAUD PREVENTION</text>
  <text x="70" y="127" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="38" font-weight="800">Card-testing response playbook</text>
  <text x="70" y="160" fill="#9bb1bc" font-family="Arial, sans-serif" font-size="18">Detect the spike, contain the endpoint, verify the payment signal, protect product access.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="220" width="245" height="280" rx="22" fill="#0b1d2a" stroke="#315463"/>
    <rect x="335" y="220" width="245" height="280" rx="22" fill="#0b1d2a" stroke="#315463"/>
    <rect x="605" y="220" width="245" height="280" rx="22" fill="#0b1d2a" stroke="#315463"/>
    <rect x="875" y="220" width="260" height="280" rx="22" fill="#0b1d2a" stroke="#315463"/>
  </g>

  <g font-family="Arial, sans-serif">
    <circle cx="108" cy="265" r="24" fill="#133846" stroke="#4fdae0"/>
    <text x="108" y="273" fill="#78e8e8" font-size="22" font-weight="800" text-anchor="middle">1</text>
    <text x="92" y="325" fill="#f5f8fa" font-size="23" font-weight="800">Detect</text>
    <text x="92" y="365" fill="#afc1ca" font-size="16">Failed payments</text>
    <text x="92" y="394" fill="#afc1ca" font-size="16">402 responses</text>
    <text x="92" y="423" fill="#afc1ca" font-size="16">Tiny authorisations</text>
    <text x="92" y="452" fill="#afc1ca" font-size="16">Signup anomalies</text>

    <circle cx="378" cy="265" r="24" fill="#133846" stroke="#4fdae0"/>
    <text x="378" y="273" fill="#78e8e8" font-size="22" font-weight="800" text-anchor="middle">2</text>
    <text x="362" y="325" fill="#f5f8fa" font-size="23" font-weight="800">Contain</text>
    <text x="362" y="365" fill="#afc1ca" font-size="16">Rate-limit routes</text>
    <text x="362" y="394" fill="#afc1ca" font-size="16">Require sessions</text>
    <text x="362" y="423" fill="#afc1ca" font-size="16">Challenge automation</text>
    <text x="362" y="452" fill="#afc1ca" font-size="16">Protect API keys</text>

    <circle cx="648" cy="265" r="24" fill="#133846" stroke="#4fdae0"/>
    <text x="648" y="273" fill="#78e8e8" font-size="22" font-weight="800" text-anchor="middle">3</text>
    <text x="632" y="325" fill="#f5f8fa" font-size="23" font-weight="800">Verify</text>
    <text x="632" y="365" fill="#afc1ca" font-size="16">Radar outcome</text>
    <text x="632" y="394" fill="#afc1ca" font-size="16">3DS result</text>
    <text x="632" y="423" fill="#afc1ca" font-size="16">Signed webhook</text>
    <text x="632" y="452" fill="#afc1ca" font-size="16">Customer context</text>

    <circle cx="918" cy="265" r="24" fill="#133846" stroke="#4fdae0"/>
    <text x="918" y="273" fill="#78e8e8" font-size="22" font-weight="800" text-anchor="middle">4</text>
    <text x="902" y="325" fill="#f5f8fa" font-size="23" font-weight="800">Protect access</text>
    <text x="902" y="365" fill="#afc1ca" font-size="16">Hold entitlements</text>
    <text x="902" y="394" fill="#afc1ca" font-size="16">Cap AI usage</text>
    <text x="902" y="423" fill="#afc1ca" font-size="16">Refund confirmed fraud</text>
    <text x="902" y="452" fill="#afc1ca" font-size="16">Monitor recovery</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 360 H330"/>
    <path d="M580 360 H600"/>
    <path d="M850 360 H870"/>
  </g>
  <g fill="#4fdae0">
    <path d="M330 360 l-10 -7 v14 z"/>
    <path d="M600 360 l-10 -7 v14 z"/>
    <path d="M870 360 l-10 -7 v14 z"/>
  </g>

  <rect x="65" y="548" width="1070" height="70" rx="18" fill="#0d2d38" stroke="#2a7882"/>
  <text x="92" y="579" fill="#65dfdd" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2">ENGINEERING PRINCIPLE</text>
  <text x="92" y="602" fill="#d9e5e9" font-family="Arial, sans-serif" font-size="17">Stripe evaluates payment risk. Your SaaS still owns identity, entitlements, usage and recovery.</text>
</svg>
