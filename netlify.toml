# Pages are hand-written HTML rendered through Astro (shared header/footer)
# into dist/. See astro.config.mjs and src/components/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7.3 needs Node 22.12 or newer.
  NODE_VERSION = "22.15.0"

[build.processing.html]
  # Preserve the explicit .html canonical URLs used by metadata, the sitemap,
  # source links, and _redirects instead of rewriting links to pretty aliases.
  pretty_urls = false

# After each successful production deploy, ping IndexNow (Bing, Yandex and
# other participating engines) with only the sitemap pages whose HTML changed
# since the last production build. Branch deploys and previews are skipped.
[[plugins]]
  package = "/netlify/plugins/indexnow"

# After a production deploy, share a newly published blog post or free tool on
# LinkedIn (one per deploy). Off unless LINKEDIN_AUTO_POST=true is set in the
# Netlify environment. See AGENTS.md "LinkedIn auto-share".
[[plugins]]
  package = "/netlify/plugins/linkedin"
