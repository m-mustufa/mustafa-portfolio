<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <!-- PNG Favicon (uses your uploaded logo) -->
    <link rel="icon" type="image/png" href="assets/img/logo-2.png" sizes="48x48" />
    <!-- Fallback SVG favicon with single 'M' and brand color -->
    <link rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23095e6c"/><text x="50" y="67" font-size="64" fill="white" font-family="Arial, sans-serif" text-anchor="middle" alignment-baseline="middle">M</text></svg>'>

    <!-- SEO Meta -->
    <title>Mustafa | Thank you</title>

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#00C19D" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#106473" },
                },
            },
        };
    </script>
</head>

<body class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center">
    <div
        class="max-w-lg w-full mx-auto bg-gray-900/80 p-10 rounded-2xl shadow-2xl border border-gray-700 flex flex-col items-center">
        <!-- Animated check icon -->
        <svg class="w-20 h-20 text-primary mb-6 animate-bounce-slow" fill="none" viewBox="0 0 72 72"
            stroke="currentColor" stroke-width="3.5">
            <circle cx="36" cy="36" r="33" stroke="currentColor" stroke-opacity="0.1" fill="none" />
            <path d="M22 36l12 12 16-20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                fill="none" />
        </svg>
        <h1 class="text-3xl md:text-4xl font-extrabold text-primary mb-4 text-center">Thank You!</h1>
        <p class="text-lg text-gray-200 mb-6 text-center">
            Your message has been sent successfully.<br>
            I'll get back to you soon—usually within 24 hours.
        </p>
        <div class="flex flex-col md:flex-row gap-4 w-full justify-center">
            <a href="/"
                class="px-6 py-3 bg-primary text-white rounded-lg font-semibold text-lg hover:bg-[#0d5968] text-center transition">Back
                to Home</a>
            <a href="mailto:mustufa50@gmail.com"
                class="px-6 py-3 bg-gray-700 text-primary rounded-lg font-semibold text-lg hover:bg-gray-600 text-center transition">Email
                Me</a>
        </div>
    </div>

    <!-- Optional: Add a little bounce animation for the checkmark icon -->
    <style>
        .animate-bounce-slow {
            animation: bounce 1.4s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-18px);
            }

            60% {
                transform: translateY(-10px);
            }
        }
    </style>
</body>

</html>
